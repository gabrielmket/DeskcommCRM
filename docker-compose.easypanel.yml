# DeskcommCRM no EasyPanel (serviço "Compose", fonte Git).
#
# Por que um compose próprio, e não o docker-compose.prod.yml:
#
#  1. O EasyPanel sobe sempre com `docker compose up --build -d`. O prod tem
#     `build:` no worker e no scheduler, então eles seriam COMPILADOS na VPS a
#     cada deploy. Aqui só existe `image:`: a VPS só baixa.
#  2. Não há instalador. O install.sh exige terminal na VPS; o serviço
#     `bootstrap` faz no banco o que ele fazia (extensões, schema, chave de
#     cifra e o dono) e roda de novo a cada deploy, como o update.sh.
#  3. Não há portas publicadas nem Let's Encrypt próprio. Quem publica e emite o
#     certificado é o Traefik do EasyPanel: o domínio aponta para o serviço
#     `caddy`, porta 80. O Caddy fica na frente do app só para manter as regras
#     do Caddyfile original (bloqueio do webhook global do WAHA e timeout longo
#     do runner do agente). Ver easypanel/Caddyfile.
#
# Passo a passo no EasyPanel: easypanel/LEIA-ME.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Roda e SAI. O app e o worker só sobem depois que ele termina com sucesso:
  # schema pela metade é app sem RLS. No painel ele aparece parado, e é o certo.
  bootstrap:
    image: postgres:17-alpine
    restart: "no"
    env_file: .env
    entrypoint: ["sh", "/deskcomm/bootstrap.sh"]
    volumes:
      - ./supabase/baseline.sql:/deskcomm/baseline.sql:ro
      - ./easypanel/bootstrap.sh:/deskcomm/bootstrap.sh:ro
    logging: *default-logging

  app:
    mem_limit: 768m
    # Versão NUMERADA, nunca `latest` (topo da main do autor). Para rodar um
    # build próprio do fork: APP_IMAGE=ghcr.io/gabrielmket/deskcommcrm:<tag>.
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:1.21.0}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  worker:
    mem_limit: 512m
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:1.21.0}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  waha:
    mem_limit: 1280m
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      # Interno: o WAHA fala com o app pela rede do compose, nunca pela internet.
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL:-http://app:3000}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:1.21.0}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./easypanel/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    # Só o caddy entra na rede do EasyPanel, onde o Traefik dele o encontra.
    # O redis roda sem senha e fica fora dela, na rede padrão do projeto.
    networks:
      - default
      - easypanel
    logging: *default-logging

volumes:
  waha-data:
  waha-media:
  caddy-data:
  caddy-config:

networks:
  easypanel:
    external: true
